<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neon Bastion</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;min-width:800px;min-height:600px}body{display:grid;place-items:center;overflow:auto;background:#28465a;font-family:"Malgun Gothic",Arial,sans-serif}#gameBox{position:relative;width:800px;height:600px;flex:none;overflow:hidden;background:#8ecb63;box-shadow:0 12px 32px #15211388}canvas{display:block;width:800px;height:600px;cursor:crosshair}#towerBar{position:absolute;z-index:2;left:16px;right:16px;bottom:13px;display:flex;gap:7px;padding:8px;border:3px solid #6f3f22;border-radius:15px;background:#4c2c1de8;box-shadow:0 3px 0 #2f1a12,0 5px 13px #26371c99}.towerButton{flex:1;min-width:0;padding:7px 5px;border:2px solid #9b6034;border-radius:9px;background:linear-gradient(#86502d,#61351f);color:#fff6dd;cursor:pointer;font:12px "Malgun Gothic",Arial;transition:.12s;text-shadow:0 1px #321b10}.towerButton:hover{transform:translateY(-2px);background:linear-gradient(#a86a39,#714025)}.towerButton.selected{border-color:#ffe17a;background:linear-gradient(#b57a3e,#794522);box-shadow:inset 0 0 0 2px #fff1a7}.towerButton b{display:block;color:#fffbe9;font-size:13px}.towerButton small{color:#ffe2a4}#message{position:absolute;z-index:3;inset:0;display:none;place-items:center;text-align:center;background:#172516cc;color:#fff7df}#messageTitle{font-size:38px;font-weight:800;text-shadow:0 3px #55301c}#message p{margin:10px 0 22px;color:#f6deb3;font-size:17px}#restart{border:2px solid #7c4122;border-radius:9px;padding:12px 24px;background:#f1bc52;color:#502916;font:bold 15px "Malgun Gothic";cursor:pointer;box-shadow:0 3px #6a351d}
</style></head>
<body><main id="gameBox"><canvas id="game" width="800" height="600" aria-label="타워 디펜스 게임"></canvas><section id="towerBar" aria-label="설치할 타워 선택"></section><div id="message"><div><div id="messageTitle"></div><p id="messageText"></p><button id="restart">다시 하기</button></div></div></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),towerBar=document.querySelector('#towerBar'),message=document.querySelector('#message'),messageTitle=document.querySelector('#messageTitle'),messageText=document.querySelector('#messageText');
// 팝업처럼 크기 조절이 허용된 창에서는 게임을 실행할 때 창 크기도 800 × 600으로 맞춥니다.
// 일반 브라우저 탭과 인앱 브라우저는 보안 정책에 따라 이 요청을 무시할 수 있습니다.
window.addEventListener('load',()=>window.resizeTo(800,600));
// 새 타워도 이 목록에 사양을 추가하면 바로 선택 버튼과 게임에 반영됩니다.
const types=[
 {id:'basic',name:'기본',damage:10,range:100,interval:1,price:50,color:'#63d8ff'},
 {id:'sniper',name:'저격',damage:40,range:220,interval:2.5,price:120,color:'#d3a6ff'},
 {id:'rapid',name:'연사',damage:5,range:85,interval:.3,price:70,color:'#83f2af'},
 {id:'cannon',name:'대포',damage:28,range:130,interval:1.8,price:110,splash:46,color:'#ffb56b'},
 {id:'frost',name:'빙결',damage:7,range:115,interval:1.2,price:90,slow:true,color:'#86e6ff'}
];
const path=[{x:-20,y:160},{x:135,y:160},{x:135,y:375},{x:370,y:375},{x:370,y:220},{x:610,y:220},{x:610,y:440},{x:820,y:440}],
// 가장 짧은 사거리(연사 타워 85) 안에 경로가 들어오도록 모든 설치 칸을 배치했습니다.
spots=[{x:72,y:265},{x:215,y:300},{x:265,y:458},{x:472,y:300},{x:515,y:145},{x:700,y:370},{x:535,y:400},{x:712,y:510}];
let gold,health,wave,enemies,towers,selected,over,spawnLeft,spawnTimer,nextWave,lastTime;
function buttons(){types.forEach(type=>{let b=document.createElement('button');b.className='towerButton';b.dataset.id=type.id;b.innerHTML=`<b>${type.name}</b><small>${type.price}G · ${type.damage} dmg</small>`;b.onclick=()=>{selected=type.id;paintButtons()};towerBar.append(b)})}
function paintButtons(){document.querySelectorAll('.towerButton').forEach(b=>b.classList.toggle('selected',b.dataset.id===selected))}
function reset(){gold=150;health=10;wave=0;enemies=[];towers=[];selected='basic';over=false;spawnLeft=0;spawnTimer=0;nextWave=1.2;lastTime=0;message.style.display='none';paintButtons()}
function startWave(){wave++;spawnLeft=5+wave*2;spawnTimer=0}function makeEnemy(){let hp=28+wave*10;enemies.push({x:path[0].x,y:path[0].y,hp,maxHp:hp,speed:42+wave*3,point:1,reward:12+wave*2,slow:0})}
function finish(win){over=true;messageTitle.textContent=win?'VICTORY':'SYSTEM FAILURE';messageText.textContent=win?'다섯 웨이브를 모두 방어했습니다.':'성문 내구도가 모두 소진되었습니다.';message.style.display='grid'}
function enemiesMove(dt){for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],p=path[e.point],dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),s=e.speed*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);if(d<=s*dt){e.x=p.x;e.y=p.y;e.point++;if(e.point===path.length){enemies.splice(i,1);if(--health<=0)finish(false)}}else{e.x+=dx/d*s*dt;e.y+=dy/d*s*dt}}}
function hit(target,tower){let t=tower.type;target.hp-=t.damage;if(t.slow)target.slow=1.1;if(t.splash)enemies.forEach(e=>{if(e!==target&&Math.hypot(e.x-target.x,e.y-target.y)<t.splash)e.hp-=t.damage});tower.flash={x:target.x,y:target.y,time:.09}}
function towersFire(dt){towers.forEach(t=>{t.cooldown-=dt;if(t.flash&&(t.flash.time-=dt)<=0)t.flash=null;if(t.cooldown>0)return;let target=null;enemies.forEach(e=>{if(Math.hypot(e.x-t.x,e.y-t.y)<t.type.range&&(!target||e.point>target.point))target=e});if(target){hit(target,t);t.cooldown=t.type.interval}});for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){gold+=enemies[i].reward;enemies.splice(i,1)}}
function update(dt){if(over)return;if(spawnLeft===0&&enemies.length===0){nextWave-=dt;if(nextWave<=0){if(wave===5)return finish(true);startWave();nextWave=1.8}}if(spawnLeft>0&&(spawnTimer-=dt)<=0){makeEnemy();spawnLeft--;spawnTimer=1.18}enemiesMove(dt);towersFire(dt)}
function drawPath(){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#9b6538';ctx.lineWidth=52;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#d9a765';ctx.lineWidth=40;ctx.stroke();ctx.strokeStyle='#f0ca83';ctx.lineWidth=2;ctx.setLineDash([4,9]);ctx.stroke();ctx.setLineDash([])}
function tree(x,y){ctx.fillStyle='#704323';ctx.fillRect(x-3,y,6,13);ctx.fillStyle='#438646';ctx.beginPath();ctx.arc(x,y-5,12,0,7);ctx.fill();ctx.fillStyle='#68aa4d';ctx.beginPath();ctx.arc(x-4,y-8,7,0,7);ctx.fill()}
function draw(){let g=ctx.createLinearGradient(0,0,800,600);g.addColorStop(0,'#a9dc79');g.addColorStop(1,'#68aa4f');ctx.fillStyle=g;ctx.fillRect(0,0,800,600);ctx.fillStyle='#82bf5d';for(let x=14;x<800;x+=36)for(let y=86;y<530;y+=36)ctx.fillRect(x,y,2,2);tree(42,105);tree(285,125);tree(745,120);tree(695,250);tree(48,475);tree(760,530);drawPath();ctx.fillStyle='#4a2a1de8';ctx.fillRect(0,0,800,76);ctx.fillStyle='#f1bd57';ctx.fillRect(0,74,800,3);ctx.font='bold 20px Malgun Gothic';ctx.fillStyle='#fff2cb';ctx.fillText(`GOLD  ${gold}`,22,31);ctx.fillText(`CORE  ${'♥'.repeat(Math.max(0,health))}`,178,31);ctx.fillText(`WAVE  ${wave} / 5`,574,31);ctx.font='13px Malgun Gothic';ctx.fillStyle='#f3dba8';ctx.fillText(`선택: ${types.find(t=>t.id===selected).name} 타워 · 빈 슬롯을 클릭해 설치`,22,57);spots.forEach(s=>{if(towers.some(t=>t.x===s.x&&t.y===s.y))return;ctx.fillStyle='#f4d47e';ctx.beginPath();ctx.arc(s.x,s.y,24,0,7);ctx.fill();ctx.strokeStyle='#8a572b';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#79502a';ctx.font='bold 19px Arial';ctx.fillText('+',s.x-6,s.y+7)});towers.forEach(t=>{ctx.fillStyle='#754426';ctx.beginPath();ctx.arc(t.x,t.y,22,0,7);ctx.fill();ctx.strokeStyle='#f6d77a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,18,0,7);ctx.stroke();ctx.fillStyle=t.type.color;ctx.beginPath();ctx.arc(t.x,t.y,8,0,7);ctx.fill();if(t.flash){ctx.strokeStyle=t.type.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.flash.x,t.flash.y);ctx.stroke()}});enemies.forEach(e=>{ctx.fillStyle=e.slow>0?'#bdeeff':'#d55346';ctx.beginPath();ctx.arc(e.x,e.y,12,0,7);ctx.fill();ctx.fillStyle='#542b24';ctx.fillRect(e.x-14,e.y-21,28,4);ctx.fillStyle='#85da58';ctx.fillRect(e.x-14,e.y-21,28*Math.max(0,e.hp)/e.maxHp,4)})}
canvas.onclick=e=>{if(over)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*600/r.height,s=spots.find(s=>Math.hypot(x-s.x,y-s.y)<27&&!towers.some(t=>t.x===s.x&&t.y===s.y)),type=types.find(t=>t.id===selected);if(s&&gold>=type.price){gold-=type.price;towers.push({x:s.x,y:s.y,type,cooldown:0,flash:null})}};
document.querySelector('#restart').onclick=reset;function loop(now){let dt=Math.min((now-lastTime)/1000||0,.05);lastTime=now;update(dt);draw();requestAnimationFrame(loop)}buttons();reset();requestAnimationFrame(loop);
</script></body></html>
